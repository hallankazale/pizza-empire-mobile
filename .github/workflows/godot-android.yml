name: Godot Android APK
on:
  push:
    branches: [ main ]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ || true
          mkdir -p build
      - name: Export Android APK
        working-directory: godot
        run: godot --headless --export-debug "Android" ../build/PizzaEmpire.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PizzaEmpire-APK
          path: build/PizzaEmpire.apk
          if-no-files-found: error
