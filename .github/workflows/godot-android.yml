name: Godot Android APK
on:
  push:
    branches: [ main ]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Configure Android
        run: |
          set -eux
          mkdir -p /root/.android build
          rm -f /root/.android/debug.keystore
          keytool -genkeypair -v -keystore /root/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p /root/.config/godot
          cat > /root/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "/root/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          mkdir -p /root/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.3.stable /root/.local/share/godot/export_templates/ || true
      - name: Export APK
        working-directory: godot
        run: |
          godot --headless --verbose --export-debug "Android" ../build/PizzaEmpire.apk
          test -f ../build/PizzaEmpire.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PizzaEmpire-APK
          path: build/PizzaEmpire.apk
          if-no-files-found: error
